name: Cloudflare production Worker

on:
  push:
    branches: [cloudflare-setup]
  workflow_dispatch:

concurrency:
  group: cloudflare-production-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Show deployment source
        run: |
          echo "Deploying commit ${{ github.sha }}"
          git log -1 --oneline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          api_token="$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          if [[ -z "${api_token}" || -z "${account_id}" ]]; then
            echo "::error::Cloudflare credentials are missing."
            exit 1
          fi
          echo "::add-mask::${api_token}"
          echo "CLOUDFLARE_API_TOKEN=${api_token}" >> "${GITHUB_ENV}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Check Wrangler authentication
        run: npm exec -- wrangler whoami

      - name: Build a fresh Worker artifact
        run: npm run build

      - name: Verify new Pengli release is inside artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/server/index.js
          grep -R -q "任選主題試問" dist/server
          grep -R -q "八大主題全部開放自由選擇" dist/server
          grep -R -q "portal-cards/cover?id=pengli" dist
          grep -R -q "pengli_free_trial_member" dist/server
          echo "Verified current Pengli UI, shared cover and free-trial logic."

      - name: Repair accounting schema idempotently
        shell: bash
        run: |
          set -euo pipefail
          repair_file() {
            local source_file="$1"
            local target_file="/tmp/$(basename "$source_file")"
            sed -E \
              -e 's/^CREATE TABLE \`/CREATE TABLE IF NOT EXISTS \`/' \
              -e 's/^CREATE UNIQUE INDEX \`/CREATE UNIQUE INDEX IF NOT EXISTS \`/' \
              -e 's/^CREATE INDEX \`/CREATE INDEX IF NOT EXISTS \`/' \
              -e 's/^INSERT INTO /INSERT OR IGNORE INTO /' \
              "$source_file" > "$target_file"
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file "$target_file"
          }

          repair_file ./drizzle/0074_accounting_books.sql
          repair_file ./drizzle/0076_accounting_qa_trial.sql
          repair_file ./drizzle/0081_accounting_ai_and_practice.sql

          accounting_columns="$(npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "PRAGMA table_info(accounting_products);" --json)"
          if ! echo "$accounting_columns" | jq -e '.. | objects | select(.name? == "cover_storage_key")' >/dev/null; then
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file ./drizzle/0075_accounting_book_cover.sql
          fi

          ai_access_columns="$(npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "PRAGMA table_info(ai_access_entitlements);" --json)"
          if ! echo "$ai_access_columns" | jq -e '.. | objects | select(.name? == "exam_category")' >/dev/null; then
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file ./drizzle/0082_ai_access_category_scope.sql
          fi

          question_columns="$(npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "PRAGMA table_info(exam_questions);" --json)"
          if ! echo "$question_columns" | jq -e '.. | objects | select(.name? == "quality_acknowledgements_json")' >/dev/null; then
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file ./drizzle/0083_question_quality_acknowledgements.sql
          fi

          npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file ./drizzle/0084_accounting_source_missing_answers.sql

      - name: Apply idempotent PDF mapping schema
        run: npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file ./drizzle/0078_document_section_mappings.sql

      - name: Apply teacher assignment columns once
        shell: bash
        run: |
          set -euo pipefail
          tables="$(npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='pengli_teacher_questions';" --json)"
          if ! echo "$tables" | jq -e '.. | objects | select(.name? == "pengli_teacher_questions")' >/dev/null; then
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "$(sed '/statement-breakpoint/d' ./drizzle/0077_pengli_teacher_questions.sql)"
          fi
          columns="$(npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "PRAGMA table_info(pengli_teacher_questions);" --json)"
          if ! echo "$columns" | jq -e '.. | objects | select(.name? == "assigned_teacher_id")' >/dev/null; then
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command 'ALTER TABLE `pengli_teacher_questions` ADD `assigned_teacher_id` integer REFERENCES `members`(`id`) ON DELETE set null;'
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command 'ALTER TABLE `pengli_teacher_questions` ADD `admin_reviewed_at` integer;'
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command 'ALTER TABLE `pengli_teacher_questions` ADD `assigned_at` integer;'
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command 'CREATE INDEX IF NOT EXISTS `pengli_teacher_questions_teacher_status_idx` ON `pengli_teacher_questions` (`assigned_teacher_id`,`status`);'
          fi

      - name: Assign Pengli documents idempotently
        shell: bash
        run: npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "$(cat ./drizzle/0079_pengli_document_assignment.sql)"

      - name: Seed verified Pengli PDF mappings
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r section_key title section_type sort_order pdf_start pdf_end; do
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "INSERT INTO document_section_mappings (document_id, section_key, title, section_type, sort_order, pdf_start_page, pdf_end_page, verified, updated_at) SELECT id, '${section_key}', '${title}', '${section_type}', ${sort_order}, ${pdf_start}, ${pdf_end}, 1, unixepoch('now') * 1000 FROM documents WHERE file_name LIKE '%.local-index.jsonl' AND (file_name LIKE '%59ML170502%' OR book_title LIKE '%行政法考點%') ON CONFLICT(document_id, section_key) DO UPDATE SET title=excluded.title, section_type=excluded.section_type, sort_order=excluded.sort_order, pdf_start_page=excluded.pdf_start_page, pdf_end_page=excluded.pdf_end_page, verified=excluded.verified, updated_at=excluded.updated_at;"
          done <<'EOF'
          front_matter|封面、序言與目錄（不供 AI 回答）|front_matter|0|1|22
          theme_1|行政法理論基礎與行政組織法|body|1|23|84
          theme_2|行政處分|body|2|85|172
          theme_3|行政契約與行政命令|body|3|173|233
          theme_4|行政罰法|body|4|234|302
          theme_5|行政執行法|body|5|303|332
          theme_6|訴願法與行政訴訟法|body|6|333|420
          theme_7|國家賠償法與損失補償|body|7|421|456
          theme_8|新進實務見解整理|body|8|457|495
          EOF

      - name: Verify target D1 is initialized
        shell: bash
        run: |
          set -euo pipefail
          result="$(npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('members', 'document_section_mappings');" --json)"
          echo "$result"
          echo "$result" | jq -e '.. | objects | select(.name? == "members")' >/dev/null
          echo "$result" | jq -e '.. | objects | select(.name? == "document_section_mappings")' >/dev/null

      - name: Deploy exact artifact to workers.dev
        run: npm exec -- wrangler deploy --keep-vars --config ./dist/server/wrangler.json --compatibility-date 2026-08-28
