name: Cloudflare production sync

on:
  push:
    branches:
      - cloudflare-setup
    paths:
      - ".cloudflare-deploy-trigger"

concurrency:
  group: cloudflare-production-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-migrate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout synchronized Cloudflare branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-setup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          api_token="$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          account_id="$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          test -n "${api_token}" && test -n "${account_id}"
          echo "::add-mask::${api_token}"
          echo "CLOUDFLARE_API_TOKEN=${api_token}" >> "${GITHUB_ENV}"
          echo "CLOUDFLARE_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Verify Cloudflare authentication
        run: npm exec -- wrangler whoami

      - name: Build latest Sites source
        run: npm run build

      - name: Apply accounting tables when absent
        shell: bash
        run: |
          set -euo pipefail
          existing="$(npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name='accounting_ai_entitlements';" --json)"
          if ! echo "$existing" | jq -e '.. | objects | select(.name? == "accounting_ai_entitlements")' >/dev/null; then
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file ./drizzle/0081_accounting_ai_and_practice.sql
          fi

      - name: Apply AI category scope when absent
        shell: bash
        run: |
          set -euo pipefail
          existing="$(npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "SELECT name FROM pragma_table_info('ai_access_entitlements') WHERE name='exam_category';" --json)"
          if ! echo "$existing" | jq -e '.. | objects | select(.name? == "exam_category")' >/dev/null; then
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file ./drizzle/0082_ai_access_category_scope.sql
          fi

      - name: Apply question quality note when absent
        shell: bash
        run: |
          set -euo pipefail
          existing="$(npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --command "SELECT name FROM pragma_table_info('exam_questions') WHERE name='quality_acknowledgements_json';" --json)"
          if ! echo "$existing" | jq -e '.. | objects | select(.name? == "quality_acknowledgements_json")' >/dev/null; then
            npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file ./drizzle/0083_question_quality_acknowledgements.sql
          fi

      - name: Mark original questions without supplied answers
        run: npm exec -- wrangler d1 execute silu-mentor-db --remote --config ./wrangler.jsonc --file ./drizzle/0084_accounting_source_missing_answers.sql

      - name: Deploy latest Worker
        run: npm exec -- wrangler deploy --config ./dist/server/wrangler.json
